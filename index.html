<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESCAPE ROOM DELLA SICUREZZA · SFIDA MATEMATICA CON SCATTO</title>
<style>
:root{--bg:#fff3d6;--card:#fff;--ink:#3a2410;--o:#e8761e;--g:#1f9d55;--b:#2f6fd6;--r:#d93a2f;--y:#ffc928;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241c12;--card:#3a2e20;--ink:#fff3dc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241c12;--card:#3a2e20;--ink:#fff3dc;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:800 18px 'Trebuchet MS',Verdana,sans-serif;text-transform:uppercase;text-align:center}
#wrap{max-width:720px;margin:0 auto;padding:12px}
#bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;background:var(--card);border-radius:20px;padding:8px 12px;border:4px solid var(--o);font-size:22px}
.dot{opacity:.3}.dot.on{opacity:1}
.slot{display:inline-block;width:32px;height:32px;line-height:28px;border:3px dashed var(--o);border-radius:10px;margin-left:3px;font-size:20px}
h2{margin:12px 0 4px;color:var(--o);font-size:24px}
.bub{display:flex;align-items:center;gap:10px;background:var(--card);border:4px solid var(--b);border-radius:24px;padding:10px;margin:8px 0;text-align:left}
.bub img{width:84px;height:60px;object-fit:cover;border-radius:16px;border:3px solid var(--o);flex:none}
.big{border:0;background:var(--g);color:#fff;font:inherit;font-size:24px;border-radius:30px;padding:14px 30px;margin:12px 0;cursor:pointer;box-shadow:0 6px 0 #146b39}
.hero{width:100%;max-width:420px;border-radius:28px;border:6px solid var(--y);margin-top:12px}
.grid3,.grid4,.g5,.g6{display:grid;gap:8px;margin-top:10px}
.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.mc{border:4px solid var(--o);background:var(--card);border-radius:16px;aspect-ratio:1;font-size:34px;cursor:pointer;padding:0;color:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:inherit;font-weight:800}
.mc.on{background:var(--y)}.mc.ok{border-color:var(--g);background:#c9f2d6}
.g5 .mc,.g6 .mc{font-size:26px}
.sg{width:100%;height:100%}
.step{aspect-ratio:auto;min-height:100px;font-size:34px;position:relative;padding:6px}.step small{font-size:13px}
.step .n{position:absolute;top:2px;left:6px;font-size:20px}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .6s}@keyframes pp{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.lock{display:flex;justify-content:center;gap:8px;margin:12px}.lock div{width:50px;height:60px;border:4px solid var(--o);border-radius:12px;background:var(--card);font-size:32px;line-height:52px}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px;font-size:40px}
.q{background:var(--card);border:4px solid var(--o);border-radius:22px;padding:14px;font-size:22px;margin:8px 0}
</style></head><body><div id="wrap">

const $=s=>document.querySelector(s),app=$('#app'),SC=$('#sc').src;
let keys=[],cur=0,T0=0,tmr;
const ts=()=>{const e=Math.floor((Date.now()-T0)/1000);return Math.floor(e/60)+':'+String(e%60).padStart(2,'0')};
const P=(b,x)=>`<svg viewBox="0 0 100 100" style="width:100%;height:100%" role="img">${b?`<rect width="100" height="100" rx="10" fill="${b}"/><rect x="3" y="3" width="94" height="94" rx="8" fill="none" stroke="#fff" stroke-width="3"/>`:''}${x}</svg>`;
const W='stroke="#fff" stroke-linecap="round" fill="none"';
const AR=[0,90,180,270].map(r=>`<g transform="rotate(${r} 50 50)"><line x1="14" y1="14" x2="30" y2="30" stroke="#fff" stroke-width="5" stroke-linecap="round"/><polygon points="36,36 22,32 32,22" fill="#fff"/></g>`).join('');
const SV={
exit:P('#1f9d55',`<rect x="60" y="20" width="26" height="52" fill="none" stroke="#fff" stroke-width="5"/><circle cx="34" cy="28" r="7" fill="#fff"/><g ${W} stroke-width="7"><path d="M36 38L30 58M36 44L50 50M36 44L24 50M30 58L42 72M30 58L18 70"/></g><path d="M14 86H70" stroke="#fff" stroke-width="5"/><polygon points="78,86 66,79 66,93" fill="#fff"/>`),
ext:P('#d93a2f',`<rect x="36" y="40" width="28" height="44" rx="8" fill="#fff"/><rect x="43" y="28" width="14" height="12" fill="#fff"/><path d="M43 28L64 22L68 29" ${W} stroke-width="4"/><path d="M64 31Q80 36 74 62" ${W} stroke-width="4"/><rect x="36" y="56" width="28" height="8" fill="#d93a2f"/>`),
raccolta:P('#1f9d55',AR+`<g fill="#fff"><circle cx="38" cy="44" r="5"/><circle cx="50" cy="40" r="5"/><circle cx="62" cy="44" r="5"/><path d="M31 64Q38 50 45 64ZM43 60Q50 46 57 60ZM55 64Q62 50 69 64Z"/></g>`),
pericolo:P('',`<polygon points="50,8 94,86 6,86" fill="#ffc928" stroke="#111" stroke-width="6" stroke-linejoin="round"/><rect x="46" y="34" width="8" height="28" rx="3" fill="#111"/><circle cx="50" cy="73" r="5" fill="#111"/>`),
fumo:P('',`<circle cx="50" cy="50" r="40" fill="#fff" stroke="#d93a2f" stroke-width="9"/><rect x="24" y="46" width="38" height="9" fill="#444"/><rect x="62" y="46" width="12" height="9" fill="#e8761e"/><path d="M70 40Q64 32 72 26" fill="none" stroke="#999" stroke-width="3"/><line x1="22" y1="78" x2="78" y2="22" stroke="#d93a2f" stroke-width="9"/>`),
aiuto:P('#1f9d55',`<rect x="40" y="18" width="20" height="64" fill="#fff"/><rect x="18" y="40" width="64" height="20" fill="#fff"/>`)};
const sg=k=>`<div class="sg">${SV[k]}</div>`;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let AC;function tone(f,t,d,ty,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;const s=AC.currentTime+t;g.gain.setValueAtTime(v||.2,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const ok=()=>[660,880].forEach((f,i)=>tone(f,i*.1,.18)),no=()=>[200,150].forEach((f,i)=>tone(f,i*.15,.2,'sawtooth',.12)),fan=()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.14,.3,'triangle'));
document.addEventListener('click',e=>{if(e.target.closest('button'))tone(440,0,.05,'square',.04)});
function bar(){$('#bar').innerHTML=['🧠','🔍','🚪','🔷','🚶'].map((e,i)=>`<span class="dot ${cur>=i+1?'on':''}">${e}</span>`).join('')+`<span>⏱️ <span id="tm">${T0?ts():'0:00'}</span></span><span>🔢${[0,1,2,3,4].map(i=>`<span class="slot">${keys[i]??''}</span>`).join('')}</span>`}
function head(t,s){return `<h2>${t}</h2><div class="bub"><img src="${SC}" alt="SCATTO"><div style="flex:1">${s}</div></div>`}
function go(n){cur=n;bar();[intro,memory,hunt,via,forme,evac,final][n]()}
const R=[['🌰 SCATTO HA 36 GHIANDE E LE METTE IN 6 CESTI UGUALI. QUANTE GHIANDE IN OGNI CESTO?',6,'PENSA ALLA TABELLINA DEL 6!'],
['🚪 IN OGNI PIANO DELLA SCUOLA CI SONO 3 PORTE DI EMERGENZA. I PIANI SONO 3. QUANTE PORTE IN TUTTO?',9,'FAI 3 × 3!'],
['🪑 IL DOPPIO DEL NUMERO SEGRETO È 8. QUAL È IL NUMERO SEGRETO?',4,'PENSA ALLA METÀ DI 8!'],
['🏃 SCATTO HA 25 GHIANDE E NE REGALA 18 AI SUOI AMICI. QUANTE GLIENE RESTANO?',7,'FAI 25 − 18!'],
['🌳 AL PUNTO DI RACCOLTA 18 BAMBINI SI METTONO IN FILE DA 9. QUANTE FILE SI FORMANO?',2,'FAI 18 ÷ 9!']];
function rid(i){const [q,a,h]=R[i];app.innerHTML=head('🧮 ENIGMA MATEMATICO · NUMERO SEGRETO '+(i+1),'PROVA SUPERATA! ORA RISOLVI L’ENIGMA PER AVERE UN NUMERO SEGRETO!')+`<div class="q">${q}</div><div class="g5">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="mc" data-n="${n}">${n}</button>`).join('')}</div><button class="big" id="hn" style="background:var(--b);box-shadow:0 6px 0 #1d4c9c;font-size:18px;padding:10px 22px">💡 INDIZIO</button><div id="hi"></div>`;
$('#hn').onclick=()=>$('#hi').textContent=h;
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(+b.dataset.n===a){ok();keys.push(a);bar();app.innerHTML=`<div class="pop"><h2>ESATTO! 🎉</h2><div class="row">🔢 ${a}</div><div class="bub"><img src="${SC}" alt=""><div style="flex:1">OTTIMO LAVORO! IL NUMERO SEGRETO È ${a}. RICORDALO O GUARDALO IN ALTO NELLO ZAINO!</div></div><button class="big" id="nx">AVANTI ➡️</button></div>`;fan();$('#nx').onclick=()=>go(cur+1)}else{no();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}})}
function intro(){app.innerHTML=`<img class="hero pop" src="${SC}" alt="SCATTO"><h2>🐿️ ESCAPE ROOM DELLA SICUREZZA</h2>`+head('CIAO, SONO SCATTO!','SUONA L’ALLARME A SCUOLA! SUPERA LE PROVE E RISOLVI GLI ENIGMI MATEMATICI PER TROVARE 5 NUMERI SEGRETI. POI APRI LA PORTA DELLA SICUREZZA PIÙ VELOCE CHE PUOI!')+`<div class="row">🏫 🔔 🧮 🔑 🚪</div><button class="big" id="v">▶️ VIA!</button>`;$('#v').onclick=()=>{T0=Date.now();clearInterval(tmr);tmr=setInterval(()=>{const e=$('#tm');if(e)e.textContent=ts()},1000);go(1)}}
function memory(){let f=null,lock=false,d=0;const B=['exit','ext','raccolta','pericolo','fumo','aiuto'],ks=shuf([...B,...B]);
app.innerHTML=head('🧠 STANZA 1 · MEMORY DEI SEGNALI','TROVA LE 6 COPPIE DI SEGNALI UGUALI!')+`<div class="grid4">${ks.map((k,i)=>`<button class="mc" data-i="${i}">❓</button>`).join('')}</div>`;
document.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('on')||b.classList.contains('ok'))return;b.innerHTML=sg(ks[b.dataset.i]);b.classList.add('on');
if(!f){f=b;return}
if(ks[f.dataset.i]===ks[b.dataset.i]){ok();f.className=b.className='mc ok';f=null;if(++d==6)setTimeout(()=>rid(0),700)}
else{lock=true;b.classList.add('shake');no();setTimeout(()=>{[f,b].forEach(x=>{x.innerHTML='❓';x.classList.remove('on','shake')});f=null;lock=false},900)}})}
function hunt(){const D=['📚','✏️','🎒','🪑','🍎','🧸','📏','🎨','🧽','🌂'],T=['exit','ext','pericolo','aiuto'];let f=0;const at=shuf([...Array(20).keys()]).slice(0,4);
app.innerHTML=head('🔍 STANZA 2 · LA CLASSE','CERCA I 4 SEGNALI NASCOSTI! TOCCA GLI OGGETTI PER SPOSTARLI E SCOPRIRE COSA C’È DIETRO!')+`<div class="row">${T.map(k=>`<div style="width:56px;height:56px;opacity:.3" id="t${k}">${sg(k)}</div>`).join('')}</div><div class="g5">${[...Array(20).keys()].map(i=>`<button class="mc" data-i="${i}">${D[i%10]}</button>`).join('')}</div>`;
document.querySelectorAll('.g5 .mc').forEach(b=>b.onclick=()=>{if(b.dataset.d)return;b.dataset.d=1;const j=at.indexOf(+b.dataset.i);b.classList.add('pop');if(j<0){b.textContent='🟫';b.style.opacity=.4;tone(260,0,.15,'triangle')}else{b.innerHTML=sg(T[j]);b.classList.add('ok');$('#t'+T[j]).style.opacity=1;ok();if(++f==4)setTimeout(()=>rid(1),900)}})}
function via(){const O=shuf(['🪑','📦','🎒','🧹']);let n=0;const c=['🐿️',...O,'🚪'];
app.innerHTML=head('🚪 STANZA 3 · LA VIA DI FUGA','IL CORRIDOIO È BLOCCATO! SPOSTA GLI OGGETTI E FAI PASSARE SCATTO FINO ALLA PORTA. ATTENZIONE: L’ESTINTORE DEVE RESTARE AL SUO POSTO!')+`<div class="g6" id="co">${c.map(e=>`<button class="mc">${e}</button>`).join('')}</div><div class="row"><button class="mc" id="ex" style="width:100px">${sg('ext')}</button></div>`;
const cs=[...document.querySelectorAll('#co .mc')];
$('#ex').onclick=()=>{no();$('#ex').classList.add('shake');setTimeout(()=>$('#ex').classList.remove('shake'),500)};
const run=()=>{let p=0;const t=setInterval(()=>{cs[p].textContent='';p++;cs[p].textContent='🐿️';ok();if(p==5){clearInterval(t);setTimeout(()=>rid(2),600)}},450)};
cs.forEach((b,i)=>{if(i&&i<5)b.onclick=()=>{if(b.dataset.d)return;b.dataset.d=1;b.textContent='';b.style.opacity=.3;ok();if(++n==4)run()}})}
function forme(){const M={fumo:0,pericolo:1,exit:2,ext:2,raccolta:2,aiuto:2};let s=null,n=0;
const SH=[`<circle cx="50" cy="50" r="42"/>`,`<polygon points="50,10 92,86 8,86" stroke-linejoin="round"/>`,`<rect x="10" y="10" width="80" height="80" rx="8"/>`];
app.innerHTML=head('🔷 STANZA 4 · LE FORME DEI SEGNALI','OGNI SEGNALE HA UNA FORMA! TOCCA UN SEGNALE E POI LA SUA FORMA: CERCHIO (DIVIETO), TRIANGOLO (PERICOLO) O QUADRATO (INDICAZIONE)!')+`<div class="grid3">${SH.map((p,i)=>`<button class="mc" data-b="${i}"><svg viewBox="0 0 100 100" style="width:100%;height:100%" fill="none" stroke="#e8761e" stroke-width="7" stroke-dasharray="12 8">${p}</svg></button>`).join('')}</div><div class="grid3">${shuf(Object.keys(M)).map(k=>`<button class="mc" data-k="${k}">${sg(k)}</button>`).join('')}</div>`;
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(b.dataset.d)return;document.querySelectorAll('[data-k]').forEach(x=>x.classList.remove('on'));s=b;b.classList.add('on')});
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(!s)return;if(M[s.dataset.k]==+b.dataset.b){s.dataset.d=1;s.classList.remove('on');s.style.opacity=.3;s=null;b.classList.add('pop');ok();if(++n==6)setTimeout(()=>rid(3),800)}else{no();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500)}})}
function evac(){const S=[['🔔','ALLARME'],['🎒❌','LASCIO LO ZAINO'],['🚶🚶','IN FILA, SENZA CORRERE'],['🚪','ESCO DALL’USCITA'],['🌳','PUNTO DI RACCOLTA']];let n=0;
app.innerHTML=head('🚶 STANZA 5 · L’EVACUAZIONE','METTI IN ORDINE LE 5 AZIONI! TOCCA PRIMA QUELLA CHE SI FA PER PRIMA!')+`<div class="grid3">${shuf([0,1,2,3,4]).map(i=>`<button class="mc step" data-i="${i}">${S[i][0]}<small>${S[i][1]}</small></button>`).join('')}</div>`;
document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;if(+b.dataset.i===n){b.classList.add('ok');b.insertAdjacentHTML('afterbegin',`<span class="n">${n+1}️⃣</span>`);ok();if(++n==5)setTimeout(()=>rid(4),800)}else{no();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500)}})}
function final(){let c=[];const want=[...keys].sort((a,b)=>b-a).join('');
app.innerHTML=head('🔐 LA PORTA FINALE','ULTIMO ENIGMA! SCATTO DICE: METTI I 5 NUMERI SEGRETI DEL TUO ZAINO DAL PIÙ GRANDE AL PIÙ PICCOLO!')+`<div class="lock" id="lk"><div></div><div></div><div></div><div></div><div></div></div><div class="g5">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="mc" data-n="${n}">${n}</button>`).join('')}</div><button class="big" id="cl" style="background:var(--r);box-shadow:0 6px 0 #8f2119;font-size:18px">↩️ CANCELLA</button>`;
const draw=()=>document.querySelectorAll('#lk div').forEach((d,i)=>d.textContent=c[i]??'');
$('#cl').onclick=()=>{c=[];draw()};
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(c.length>=5)return;c.push(b.dataset.n);draw();if(c.length==5){if(c.join('')===want){const e=(Date.now()-T0)/1000,st=e<600?3:e<900?2:1;clearInterval(tmr);setTimeout(()=>{app.innerHTML=`<div class="pop"><img class="hero" src="${SC}" alt="SCATTO"><h2>🚪✨ PORTA APERTA! ✨🎉</h2><div class="row">${'⭐'.repeat(st)}</div><div class="q">TEMPO: ${ts()}<br>${st==3?'SIETE DEI VERI CAMPIONI DELLA SICUREZZA!':st==2?'BRAVISSIMI! RIUSCITE A FARE ANCORA MEGLIO?':'CE L’AVETE FATTA! RIPROVATE PER AVERE PIÙ STELLE!'}</div><div class="row">🏅 🎉 🐿️ 🎊 🏅</div><button class="big" id="rs">🔄 RICOMINCIA</button></div>`;fan();$('#rs').onclick=()=>{keys=[];T0=0;go(0)}},400)}else{no();$('#lk').classList.add('shake');setTimeout(()=>{c=[];draw();$('#lk').classList.remove('shake')},600)}}})}
go(0);
</script></body></html>
